name: Forecast on new AI tournament questions

on:
  workflow_dispatch:
  schedule:
    # Two independent entries: GitHub drops many scheduled firings (nostreambot measured ~22% delivered), and a run
    # that finds no new questions costs ~nothing. Already-forecasted questions are skipped. (B-06)
    - cron: "7,27,47 * * * *"
    - cron: "17,37,57 * * * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  forecast_job:
    # Live publishing is off until the repository variable LIVE_ENABLED is set to "true"
    # (Settings → Secrets and variables → Actions → Variables). Manual runs are allowed regardless.
    if: ${{ vars.LIVE_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      # B-61: the retry ledger (state/retries.json) survives between runs in the Actions cache. Restore the newest entry,
      # save under a new key at the end (cache entries are immutable). A cache miss just means no history.
      - name: Restore retry ledger
        uses: actions/cache/restore@v4
        with:
          path: state
          key: retry-ledger-${{ github.run_id }}
          restore-keys: retry-ledger-
      - name: Run bot
        run: poetry run python main.py --mode tournament --publish
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
      # B-40: Metaculus Cup + 2 main-site questions, 5 times a day (slots at 00/05/10/15/20 UTC, first ~12 minutes of the hour),
      # so we unlock outcomes for evaluation (~10 main-site questions/day). Bots are allowed there; comments stay private.
      - name: Run bot on Metaculus Cup + main-site questions
        if: success() || failure()
        run: |
          H=$(date -u +%H); M=$(date -u +%M)
          case "$H" in 00|05|10|15|20) ;; *) echo "Not a wide-run slot"; exit 0;; esac
          if [ "$M" -ge 12 ]; then echo "Not a wide-run slot"; exit 0; fi
          poetry run python main.py --mode wide --publish --main-site-max 2
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
      - name: Save retry ledger
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: retry-ledger-${{ github.run_id }}
      # Records can contain licensed news text (AskNews), and artifacts on a public repo are downloadable by anyone, so they
      # are encrypted with ARCHIVE_KEY. tools/build_monitor.py decrypts them into the private archive. Never upload plaintext.
      - name: Encrypt forecast records
        if: always()
        env:
          ARCHIVE_KEY: ${{ secrets.ARCHIVE_KEY }}
        run: |
          if ls data/forecasts/*/forecasts.jsonl >/dev/null 2>&1; then
            if [ -z "$ARCHIVE_KEY" ]; then echo "ARCHIVE_KEY secret is missing; refusing to upload records unencrypted"; exit 1; fi
            mkdir -p upload
            tar czf - data/forecasts | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:ARCHIVE_KEY -out upload/records.tar.gz.enc
          fi
      - name: Upload encrypted forecast records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forecasts-${{ github.run_id }}
          path: upload/records.tar.gz.enc
          if-no-files-found: ignore
          retention-days: 90
